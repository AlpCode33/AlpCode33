<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <!-- كېچىلىك ئاسمان رەڭ ئۆزگىرىشى -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040b16" />
      <stop offset="50%" stop-color="#0a1e38" />
      <stop offset="85%" stop-color="#0f3156" />
      <stop offset="100%" stop-color="#16426b" />
    </linearGradient>

    <!-- تاغلار ئۈچۈن رەڭلەر -->
    <linearGradient id="mtnFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#133354" />
      <stop offset="100%" stop-color="#0a1d33" />
    </linearGradient>
    <linearGradient id="mtnMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2540" />
      <stop offset="100%" stop-color="#061322" />
    </linearGradient>
    <linearGradient id="mtnNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071629" />
      <stop offset="100%" stop-color="#030a14" />
    </linearGradient>

    <!-- كۆك بايراق رەڭگىدە نۇر چىقىرىش ئۈنۈمى (Glow) -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- قارىغاي دەرىخى قېلىپى -->
    <g id="pine">
      <polygon points="0,-42 -11,-24 -5,-24 -15,-8 -8,-8 -19,10 19,10 8,-8 15,-8 5,-24 11,-24" fill="#02070d" />
      <rect x="-2.5" y="10" width="5" height="8" fill="#02070d" />
    </g>

    <style>
      /* خەرىتە سىزىقىنىڭ ھەرىكىتى */
      .et-map {
        fill: rgba(0, 175, 222, 0.07);
        stroke: #00AFDE;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 2200;
        stroke-dashoffset: 2200;
        animation: drawMap 4.5s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                   pulseMap 4s ease-in-out 4.5s infinite alternate;
      }

      @keyframes drawMap {
        to { stroke-dashoffset: 0; }
      }

      @keyframes pulseMap {
        0% { fill: rgba(0, 175, 222, 0.05); stroke-width: 3.2; }
        100% { fill: rgba(0, 175, 222, 0.14); stroke-width: 4.2; }
      }

      /* ئاي ۋە يۇلتۇز ھەرىكىتى */
      .crescent-star {
        fill: #00AFDE;
        opacity: 0;
        animation: fadeInEmblem 2s ease-out 2.2s forwards,
                   glowEmblem 3s ease-in-out 4.2s infinite alternate;
      }

      @keyframes fadeInEmblem {
        from { opacity: 0; transform: scale(0.92); transform-origin: 550px 235px; }
        to { opacity: 0.95; transform: scale(1); transform-origin: 550px 235px; }
      }

      @keyframes glowEmblem {
        from { opacity: 0.8; }
        to { opacity: 1; }
      }

      /* شەھەر نۇقتىسى ۋە دولقۇنى */
      .city-group {
        opacity: 0;
        animation: showCity 1s ease-out 3.2s forwards;
      }

      @keyframes showCity {
        to { opacity: 1; }
      }

      .city-dot {
        fill: #ffffff;
        stroke: #00AFDE;
        stroke-width: 3;
      }

      .city-ripple {
        fill: none;
        stroke: #00AFDE;
        stroke-width: 2.5;
        animation: rippleEffect 2.4s ease-out infinite;
      }

      .city-ripple-delay {
        fill: none;
        stroke: #00AFDE;
        stroke-width: 2;
        animation: rippleEffect 2.4s ease-out 1.2s infinite;
      }

      @keyframes rippleEffect {
        0% { r: 4; opacity: 1; stroke-width: 3; }
        100% { r: 28; opacity: 0; stroke-width: 0.5; }
      }

      /* شەھەر ئىسمى خەت پاسونى */
      .city-label {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: #E6F7FF;
        letter-spacing: 1px;
      }

      .city-line {
        stroke: #00AFDE;
        stroke-width: 1.5;
        stroke-dasharray: 3, 3;
        opacity: 0.75;
      }

      /* ئاسماندىكى يۇلتۇزلار چاقنىشى */
      .star {
        fill: #ffffff;
        animation: twinkle 3s ease-in-out infinite alternate;
      }
      .s2 { animation-delay: 1s; animation-duration: 2.5s; }
      .s3 { animation-delay: 2s; animation-duration: 3.8s; }

      @keyframes twinkle {
        0% { opacity: 0.2; }
        100% { opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- 1. ئاسمان تەگلىكى -->
  <rect width="1200" height="560" fill="url(#skyGrad)" />

  <!-- 2. ئاسماندىكى يۇلتۇزلار -->
  <g>
    <circle cx="120" cy="60" r="1.2" class="star" />
    <circle cx="230" cy="110" r="1.5" class="star s2" />
    <circle cx="340" cy="45" r="1" class="star s3" />
    <circle cx="480" cy="70" r="1.4" class="star" />
    <circle cx="670" cy="40" r="1.2" class="star s2" />
    <circle cx="820" cy="85" r="1.6" class="star s3" />
    <circle cx="960" cy="50" r="1.1" class="star" />
    <circle cx="1090" cy="95" r="1.5" class="star s2" />
    <circle cx="80" cy="180" r="1.3" class="star s3" />
    <circle cx="1030" cy="175" r="1.2" class="star" />
    <circle cx="160" cy="240" r="1" class="star s2" />
    <circle cx="910" cy="140" r="1.4" class="star s3" />
  </g>

  <!-- 3. شەرقىي تۈركىستاننىڭ ھەرىكەتلىك خەرىتىسى ۋە ئاي-يۇلتۇز -->
  <g>
    <!-- شەرقىي تۈركىستان خەرىتىسىنىڭ سىزىقى -->
    <path class="et-map" filter="url(#blueGlow)" d="
      M 625,52
      L 652,62 L 675,88 L 690,115 L 725,132 L 762,155 L 802,168
      L 848,180 L 892,202 L 915,224 L 896,248 L 860,264 L 828,288
      L 795,302 L 758,318 L 718,338 L 668,354 L 615,365 L 558,368
      L 505,362 L 452,370 L 402,356 L 362,334 L 328,308 L 315,280
      L 335,256 L 368,242 L 398,225 L 430,208 L 448,180 L 478,158
      L 512,140 L 542,115 L 568,85 L 598,62 Z
    " />

    <!-- كۆك بايراقتىكى ئاي ۋە يۇلتۇز (خەرىتە مەركىزىدە) -->
    <g class="crescent-star" filter="url(#blueGlow)">
      <!-- ئاي (Crescent) -->
      <path d="M 552,186
               A 52,52 0 1,0 552,286
               A 43,43 0 1,1 552,186 Z" />
      <!-- بەش بۇرجەكلىك يۇلتۇز (Star) -->
      <polygon points="
        578,236
        591,241 595,255 604,244 618,246
        610,236
        618,226 604,228 595,217 591,231
      " />
    </g>

    <!-- شەھەر 1: Ürümchi (شىمالىي قىسىم) -->
    <g class="city-group">
      <circle cx="672" cy="188" r="5" class="city-ripple" />
      <circle cx="672" cy="188" r="5" class="city-ripple-delay" />
      <circle cx="672" cy="188" r="5.5" class="city-dot" filter="url(#softGlow)" />
      <line x1="678" y1="184" x2="705" y2="165" class="city-line" />
      <text x="712" y="169" class="city-label" filter="url(#softGlow)">Ürümchi</text>
    </g>

    <!-- شەھەر 2: Qeshqer (غەربىي جەنۇب قىسىم) -->
    <g class="city-group">
      <circle cx="382" cy="276" r="5" class="city-ripple" />
      <circle cx="382" cy="276" r="5" class="city-ripple-delay" />
      <circle cx="382" cy="276" r="5.5" class="city-dot" filter="url(#softGlow)" />
      <line x1="375" y1="272" x2="345" y2="252" class="city-line" />
      <text x="338" y="248" text-anchor="end" class="city-label" filter="url(#softGlow)">Qeshqer</text>
    </g>
  </g>

  <!-- 4. ئارقا تەگلىكتىكى قاتمۇ-قات تاغلار (تەڭرىتاغ ئۇسلۇبىدا) -->
  <!-- يىراقتىكى تاغلار -->
  <polygon fill="url(#mtnFar)" opacity="0.85" points="
    0,460 0,385 85,335 165,375 260,305 355,365 445,320
    540,380 635,310 735,370 830,295 930,360 1035,305 1125,355 1200,320 1200,560 0,560
  " />
  <!-- تاغ چوققىسىدىكى يىراق قار سىزىقلىرى -->
  <polygon fill="#1e4d7b" opacity="0.35" points="
    260,305 235,324 262,318 285,330
  " />
  <polygon fill="#1e4d7b" opacity="0.35" points="
    830,295 805,316 832,310 858,324
  " />

  <!-- ئوتتۇرا قەۋەتتىكى تاغلار -->
  <polygon fill="url(#mtnMid)" points="
    0,490 0,415 110,365 215,420 320,350 430,415 525,365
    640,425 755,355 865,415 975,345 1085,405 1200,360 1200,560 0,560
  " />

  <!-- يېقىن قەۋەتتىكى تاغلار -->
  <polygon fill="url(#mtnNear)" points="
    0,520 0,445 95,410 190,455 295,395 410,460 535,405
    655,465 775,400 890,455 1010,395 1115,445 1200,415 1200,560 0,560
  " />

  <!-- 5. ئەڭ ئاستىدىكى قارىغاي ئورمانلىقى (Pine Trees Silhouette) -->
  <rect x="0" y="512" width="1200" height="48" fill="#02070d" />
  <g>
    <use href="#pine" transform="translate(20, 505) scale(1.2)" />
    <use href="#pine" transform="translate(55, 510) scale(0.95)" />
    <use href="#pine" transform="translate(88, 502) scale(1.35)" />
    <use href="#pine" transform="translate(125, 508) scale(1.05)" />
    <use href="#pine" transform="translate(160, 504) scale(1.25)" />
    <use href="#pine" transform="translate(195, 512) scale(0.85)" />
    <use href="#pine" transform="translate(230, 506) scale(1.15)" />
    <use href="#pine" transform="translate(268, 500) scale(1.4)" />
    <use href="#pine" transform="translate(305, 510) scale(0.95)" />
    <use href="#pine" transform="translate(342, 505) scale(1.2)" />
    <use href="#pine" transform="translate(380, 511) scale(0.9)" />
    <use href="#pine" transform="translate(415, 503) scale(1.3)" />
    <use href="#pine" transform="translate(455, 509) scale(1.0)" />
    <use href="#pine" transform="translate(490, 504) scale(1.2)" />
    <use href="#pine" transform="translate(530, 512) scale(0.85)" />
    <use href="#pine" transform="translate(565, 506) scale(1.15)" />
    <use href="#pine" transform="translate(602, 509) scale(1.0)" />
    <use href="#pine" transform="translate(640, 502) scale(1.3)" />
    <use href="#pine" transform="translate(678, 510) scale(0.95)" />
    <use href="#pine" transform="translate(715, 505) scale(1.2)" />
    <use href="#pine" transform="translate(752, 511) scale(0.9)" />
    <use href="#pine" transform="translate(790, 501) scale(1.35)" />
    <use href="#pine" transform="translate(828, 508) scale(1.05)" />
    <use href="#pine" transform="translate(865, 504) scale(1.25)" />
    <use href="#pine" transform="translate(902, 512) scale(0.85)" />
    <use href="#pine" transform="translate(938, 506) scale(1.15)" />
    <use href="#pine" transform="translate(975, 500) scale(1.4)" />
    <use href="#pine" transform="translate(1015, 509) scale(1.0)" />
    <use href="#pine" transform="translate(1052, 504) scale(1.25)" />
    <use href="#pine" transform="translate(1090, 511) scale(0.9)" />
    <use href="#pine" transform="translate(1128, 502) scale(1.35)" />
    <use href="#pine" transform="translate(1165, 507) scale(1.1)" />
    <use href="#pine" transform="translate(1195, 504) scale(1.2)" />
  </g>
</svg>
